<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1EA;--paper:#FFFBF2;--cream:#F4EAD5;
  --brown:#6B4F3A;--brown-2:#A88566;--accent:#D98C6B;--accent-2:#E3B89A;
  --green:#7A9A6E;--red:#C76B5B;--yellow:#E8B84B;--blue:#6B8DB5;
  --ink:#3D2E22;--line:rgba(107,79,58,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Noto Sans SC',-apple-system,sans-serif;color:var(--ink);font-size:14px;background:var(--bg)}

.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50;box-shadow:0 2px 10px rgba(107,79,58,.06)}
.topbar .title{font-family:'Caveat';font-size:21px;font-weight:700;color:var(--brown)}
.topbar .date{font-size:11px;color:var(--brown-2)}

.main{padding:66px 14px 26px;max-width:760px;margin:0 auto}
.page-title{font-family:'Caveat';font-size:28px;font-weight:700;color:var(--brown);margin-bottom:3px}
.page-sub{font-size:12px;color:var(--brown-2);margin-bottom:14px}

.hot-tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.hot-tabs .tab{font-size:12px;padding:5px 11px;border-radius:12px;background:var(--cream);color:var(--brown);cursor:pointer;border:1px solid transparent}
.hot-tabs .tab.active{background:var(--accent);color:#fff}
.hot-list{max-height:none;overflow-y:visible}
.hot-item{display:block;padding:10px;border-radius:9px;text-decoration:none;color:var(--ink);border:1px solid transparent;margin-bottom:5px;background:var(--cream)}
.hot-item:hover{border-color:var(--accent-2)}
.hot-item .ht{font-size:13px;font-weight:500}
.hot-item .hm{font-size:10px;color:var(--brown-2);margin-top:2px}
.hot-item .badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;margin-left:4px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">我的工作台</div>
  <div class="date" id="topDate"></div>
</div>

<div class="main">
  <div class="page-title">Hot & Trends</div>
  <div class="page-sub">实时热点、财经资讯、商机风口</div>
  <div class="hot-tabs" id="hotTabs">
    <div class="tab active" data-src="36kr">36氪</div>
    <div class="tab" data-src="hot">热搜</div>
    <div class="tab" data-src="finance">财经</div>
    <div class="tab" data-src="policy">政策</div>
    <div class="tab" data-src="side">副业</div>
  </div>
  <div class="hot-list" id="hotList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1500);}
const now=new Date();
const days=['日','一','二','三','四','五','六'];
$('#topDate').textContent=`${now.getMonth()+1}月${now.getDate()}日 周${days[now.getDay()]}`;

// 热点
const HOT={'36kr':{type:'iframe',url:'https://36kr.com/'},'hot':{type:'links',data:[{t:'微博热搜',u:'https://s.weibo.com/top/summary',b:1},{t:'知乎热榜',u:'https://www.zhihu.com/hot',b:1},{t:'B站热搜',u:'https://www.bilibili.com/v/popular/rank/all'},{t:'百度热搜',u:'https://top.baidu.com/board?tab=realtime',b:1},{t:'抖音热点',u:'https://www.douyin.com/hot'},{t:'今日头条',u:'https://www.toutiao.com/'}]},'finance':{type:'links',data:[{t:'36氪',u:'https://36kr.com/',b:1,d:'创投/风口'},{t:'虎嗅',u:'https://www.huxiu.com/',d:'商业评论'},{t:'钛媒体',u:'https://www.tmtpost.com/',d:'科技财经'},{t:'华尔街见闻',u:'https://wallstreetcn.com/',b:1,d:'全球市场'},{t:'雪球',u:'https://xueqiu.com/',d:'投资社区'},{t:'东方财富',u:'https://www.eastmoney.com/',d:'行情数据'}]},'policy':{type:'links',data:[{t:'中国人民银行',u:'http://www.pbc.gov.cn/',d:'货币政策',b:1},{t:'国家统计局',u:'http://www.stats.gov.cn/',d:'经济数据'},{t:'发改委',u:'https://www.ndrc.gov.cn/',d:'产业政策'},{t:'中国政府网',u:'https://www.gov.cn/',d:'政策发布'},{t:'财政部',u:'http://www.mof.gov.cn/',d:'财政/税收'},{t:'证监会',u:'http://www.csrc.gov.cn/',d:'资本市场'}]},'side':{type:'links',data:[{t:'什么值得买',u:'https://www.smzdm.com/',d:'信息差',b:1},{t:'闲鱼',u:'https://www.goofish.com/',d:'二手转卖'},{t:'小红书创作',u:'https://creator.xiaohongshu.com/',d:'内容变现'},{t:'B站创作',u:'https://member.bilibili.com/',d:'视频up主'},{t:'电鸭社区',u:'https://eleduck.com/',d:'远程兼职',b:1},{t:'圆领',u:'https://www.yuanling.com/',d:'远程工作'}]}};
function loadHot(src){const l=$('#hotList'),cfg=HOT[src];if(!cfg)return;if(cfg.type==='iframe'){l.innerHTML=`<iframe style="width:100%;height:600px;border:1px solid var(--line);border-radius:10px" src="${cfg.url}"></iframe><div style="text-align:center;margin-top:8px;font-size:11px;color:var(--brown-2)">打不开？<a href="${cfg.url}" target="_blank" style="color:var(--accent)">点这里</a> 直接访问</div>`;}else{l.innerHTML=cfg.data.map(d=>`<a class="hot-item" href="${d.u}" target="_blank"><div class="ht">${d.t} ${d.b?'<span class="badge">热</span>':''}</div><div class="hm">${d.d||'点击直达'} ↗</div></a>`).join('');}}
$$('.hot-tabs .tab').forEach(t=>t.onclick=()=>{$$('.hot-tabs .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');loadHot(t.dataset.src);});
loadHot('36kr');
</script>
</body>
</html>
